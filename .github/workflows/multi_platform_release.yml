name: Multi-Platform Release Packaging

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  # -------------------------------------------------------------
  # 1. Developer Atmosphere: NPM Packages & SDK
  # -------------------------------------------------------------
  package-sdk:
    name: Package SDK & Shared Libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install & Build Packages
        run: |
          pnpm install
          pnpm --filter @arthora/shared build
          pnpm --filter @arthora/sdk build

      - name: Pack NPM Tarballs
        run: |
          mkdir -p dist/packages
          cd packages/shared && npm pack --pack-destination ../../dist/packages
          cd ../../packages/sdk && npm pack --pack-destination ../../dist/packages

      - name: Upload SDK Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: arthora-npm-packages
          path: dist/packages/*.tgz

  # -------------------------------------------------------------
  # 2. Web Atmosphere: Next.js PWA Static Bundle
  # -------------------------------------------------------------
  package-web:
    name: Package Web & PWA Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Build Web Static Export
        env:
          NEXT_PUBLIC_API_URL: https://arthora-api.onrender.com
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: arthora-659a8.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: arthora-659a8
        run: |
          pnpm install
          pnpm --filter @arthora/shared build
          pnpm --filter @arthora/web build

      - name: Archive Web Bundle
        run: |
          mkdir -p dist/web
          tar -czf dist/web/arthora-web-bundle.tar.gz -C apps/web/out .

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v7
        with:
          name: arthora-web-bundle
          path: dist/web/*.tar.gz

  # -------------------------------------------------------------
  # 3. Mobile Atmosphere: Android Release APK
  # -------------------------------------------------------------
  package-mobile:
    name: Package Android Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Build Android Release APK
        run: |
          cd arthora_mobile
          flutter pub get
          flutter build apk --release --dart-define=API_BASE_URL="https://arthora-api.onrender.com/api/v1"
          mkdir -p ../dist/mobile
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/mobile/arthora-release.apk

      - name: Upload Mobile Artifact
        uses: actions/upload-artifact@v7
        with:
          name: arthora-android-apk
          path: dist/mobile/*.apk

  # -------------------------------------------------------------
  # 4. Multi-Platform GitHub Release
  # -------------------------------------------------------------
  publish-release:
    name: Publish Multi-Platform Release
    needs: [package-sdk, package-web, package-mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all built artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts

      - name: Organize Release Assets & Checksums
        run: |
          mkdir -p release-dist
          find release-artifacts -type f -name "*.tgz" -exec cp {} release-dist/ \;
          find release-artifacts -type f -name "*.tar.gz" -exec cp {} release-dist/ \;
          find release-artifacts -type f -name "*.apk" -exec cp {} release-dist/ \;
          cd release-dist
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: "Arthora Multi-Platform Release ${{ github.event.inputs.release_tag || github.ref_name }}"
          draft: false
          prerelease: false
          files: |
            release-dist/*
          body: |
            ## 🚀 Arthora Multi-Platform Packages & Release Assets

            Universal release packaging across all supported user atmospheres and devices.

            ### 📦 Device & Platform Packages
            - **Web & PWA:** [Live Web Application](https://out-sand-phi-45.vercel.app) • Standalone PWA installable on Desktop (Windows/macOS/Linux) and Mobile (Android/iOS)
            - **Android:** Download `arthora-release.apk` attached below for direct Android sideloading.
            - **Developer SDK:** `@arthora/sdk` and `@arthora/shared` npm tarballs attached below.
            - **Backend API:** [Live Render Gateway](https://arthora-api.onrender.com/api/v1/health)

            ### 🔒 Integrity Checksums
            Verify asset integrity via `SHA256SUMS.txt` attached to this release.
