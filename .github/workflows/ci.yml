name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Shared Packages
        run: |
          pnpm --filter @arthora/shared build
          pnpm --filter @arthora/sdk build

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript Type Check
        run: pnpm run type-check

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Shared Packages
        run: |
          pnpm --filter @arthora/shared build
          pnpm --filter @arthora/sdk build

      - name: Run Vitest Suite (91 Tests)
        run: pnpm run test
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_minimum_32_characters_long
          JWT_REFRESH_SECRET: test_refresh_secret_minimum_32_characters
          FIREBASE_PROJECT_ID: arthora-659a8
          FIREBASE_CLIENT_EMAIL: test@arthora-659a8.iam.gserviceaccount.com
          FIREBASE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nMIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQD...==\n-----END PRIVATE KEY-----\n"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test_dummy_gemini_api_key' }}
          GEMINI_MODEL: gemini-3.6-flash

  build:
    name: Production Builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build All Monorepo Projects
        run: |
          pnpm --filter @arthora/shared build
          pnpm --filter @arthora/sdk build
          pnpm --filter @arthora/api build
          pnpm --filter @arthora/web build
        env:
          NEXT_PUBLIC_API_URL: https://arthora-api.onrender.com
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'AIzaSy_dummy_key_for_ci_build' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: arthora-659a8.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: arthora-659a8

      - name: Upload Web Build Output
        uses: actions/upload-artifact@v4
        with:
          name: web-static-export
          path: apps/web/out
          retention-days: 7

  docker-build:
    name: Docker Container Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Verify API Docker Build
        run: docker build -f apps/api/Dockerfile -t arthora-api:verify .
