  <text x="560" y="245" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">AI Intelligence Core</text>
  <text x="560" y="265" text-anchor="middle" fill="#FFD027" font-size="10">Gemini 1.5 Flash Cascading AI</text>
  <text x="560" y="285" text-anchor="middle" fill="#C9D1D9" font-size="9">Zod Schema Output Guardrails</text>
