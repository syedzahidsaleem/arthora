  <rect x="460" y="85" width="200" height="4" rx="2" fill="#7BED9F"/>
  <text x="560" y="110" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">Quantitative Risk Engine</text>
  <text x="560" y="130" text-anchor="middle" fill="#7BED9F" font-size="10">Deterministic Calculations</text>
  <text x="560" y="150" text-anchor="middle" fill="#8B949E" font-size="9">CAGR • Volatility • Max Drawdown</text>
  <text x="560" y="170" text-anchor="middle" fill="#8B949E" font-size="9">Sharpe • Sortino • Rolling Returns</text>

