  <text x="100" y="65" text-anchor="middle" fill="#8B949E" font-size="11" font-weight="600" letter-spacing="0.5">1. DATA INGESTION</text>
  <text x="320" y="65" text-anchor="middle" fill="#8B949E" font-size="11" font-weight="600" letter-spacing="0.5">2. CORE API &amp; PERSISTENCE</text>
  <text x="560" y="65" text-anchor="middle" fill="#8B949E" font-size="11" font-weight="600" letter-spacing="0.5">3. QUANT &amp; AI REASONING</text>
  <text x="780" y="65" text-anchor="middle" fill="#8B949E" font-size="11" font-weight="600" letter-spacing="0.5">4. CLIENT SURFACES</text>

  <!-- LAYER 1: DATA SOURCES -->
  <!-- Box 1A -->
  <rect x="20" y="85" width="160" height="90" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="20" y="85" width="160" height="4" rx="2" fill="#4FBBBC"/>
  <text x="100" y="112" text-anchor="middle" fill="#7BED9F" font-size="12" font-weight="700">AMFI Mutual Funds</text>
  <text x="100" y="132" text-anchor="middle" fill="#C9D1D9" font-size="10">40,000+ Live NAV Feeds</text>
  <text x="100" y="152" text-anchor="middle" fill="#8B949E" font-size="9">mfapi.in REST Engine</text>

  <!-- Box 1B -->
  <rect x="20" y="220" width="160" height="90" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="20" y="220" width="160" height="4" rx="2" fill="#4FBBBC"/>
  <text x="100" y="247" text-anchor="middle" fill="#7BED9F" font-size="12" font-weight="700">NSE / BSE Equities</text>
  <text x="100" y="267" text-anchor="middle" fill="#C9D1D9" font-size="10">Real-Time Quotes</text>
  <text x="100" y="287" text-anchor="middle" fill="#8B949E" font-size="9">Yahoo Finance API</text>

