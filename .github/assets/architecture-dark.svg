  <text x="320" y="285" text-anchor="middle" fill="#C9D1D9" font-size="9">Redis Cache (Upstash)</text>
  <text x="320" y="305" text-anchor="middle" fill="#8B949E" font-size="9">BullMQ Worker (In-Process)</text>

