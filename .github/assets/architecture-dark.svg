<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="100%" height="auto" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="mintGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7BED9F" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4FBBBC" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="goldGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD027" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F39120" stop-opacity="0.1"/>
    </linearGradient>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7BED9F"/>
    </marker>
    <marker id="arrowGoldDark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#FFD027"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="440" y="32" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700" letter-spacing="1">ARTHORA SYSTEM ARCHITECTURE &amp; DATA PIPELINE</text>

