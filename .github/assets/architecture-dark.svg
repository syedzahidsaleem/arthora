  <text x="320" y="130" text-anchor="middle" fill="#7BED9F" font-size="10">Render Web Service (Node)</text>
  <text x="320" y="150" text-anchor="middle" fill="#8B949E" font-size="9">JWT Auth • Rate Limiting</text>
  <text x="320" y="170" text-anchor="middle" fill="#8B949E" font-size="9">Zod Validation • CORS</text>

