  <text x="785" y="267" text-anchor="middle" fill="#4FBBBC" font-size="10">Cross-Platform (iOS/Android)</text>
  <text x="785" y="287" text-anchor="middle" fill="#C9D1D9" font-size="9">Riverpod State Flow</text>
  <text x="785" y="307" text-anchor="middle" fill="#8B949E" font-size="9">apps/mobile Workspace</text>

  <!-- CONNECTING ARROWS -->
  <!-- Layer 1 to Layer 2 -->
  <line x1="180" y1="130" x2="225" y2="130" stroke="#7BED9F" stroke-width="1.5" marker-end="url(#arrowDark)"/>
  <line x1="180" y1="265" x2="225" y2="155" stroke="#7BED9F" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowDark)"/>

  <!-- Layer 2 internal -->
  <line x1="320" y1="195" x2="320" y2="215" stroke="#8B949E" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Layer 2 to Layer 3 -->
  <line x1="410" y1="130" x2="455" y2="130" stroke="#7BED9F" stroke-width="1.5" marker-end="url(#arrowDark)"/>
  <line x1="410" y1="275" x2="455" y2="275" stroke="#FFD027" stroke-width="1.5" marker-end="url(#arrowGoldDark)"/>

  <!-- Layer 3 to Layer 4 -->
  <line x1="660" y1="130" x2="705" y2="130" stroke="#7BED9F" stroke-width="1.5" marker-end="url(#arrowDark)"/>
  <line x1="660" y1="275" x2="705" y2="275" stroke="#FFD027" stroke-width="1.5" marker-end="url(#arrowGoldDark)"/>

  <!-- Footer notice -->
  <rect x="20" y="365" width="840" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="440" y="389" text-anchor="middle" fill="#8B949E" font-size="10">🛡️ SEBI Educational Notice: Quantitative screening platform for research &amp; educational purposes. Zero commission bias.</text>
</svg>
