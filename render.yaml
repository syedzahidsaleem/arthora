services:
  - type: web
    name: arthora-api
    env: node
    plan: free
    region: singapore
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @arthora/shared build && pnpm --filter @arthora/api build
    startCommand: pnpm --filter @arthora/api start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: ALLOWED_ORIGINS
        value: https://arthora.vercel.app,https://arthora.in,http://localhost:3000
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false

  - type: web
    name: arthora-web
    runtime: static
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @arthora/shared build && pnpm --filter @arthora/web build
    staticPublishPath: ./apps/web/out
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

